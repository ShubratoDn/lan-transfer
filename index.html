<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HopDrop</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1c2430; --muted:#6b7686; --line:#e1e6ee; --accent:#1f8a70; --danger:#c0392b; --sel:#e6f5f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b2129; --text:#e6ebf2; --muted:#8c97a7; --line:#2b3340; --accent:#3cc19f; --danger:#ef6b5b; --sel:#17342d; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,Segoe UI,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px 16px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:14px; margin:0 0 10px; color:var(--muted); font-weight:600; }
  .me { display:flex; align-items:center; gap:8px; font-size:14px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--danger); }
  .dot.on { background:var(--accent); }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tabs button { flex:1; background:var(--card); color:var(--text); border:1px solid var(--line); padding:10px; position:relative; }
  .tabs button.act { background:var(--accent); color:#fff; border-color:var(--accent); }
  .badge { background:var(--danger); color:#fff; border-radius:9px; padding:0 6px; font-size:12px; margin-left:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  button { font:inherit; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 14px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--line); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .row:empty { display:none; }
  .peers { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .peer { background:var(--bg); color:var(--text); border:2px solid var(--line); padding:12px 8px; text-align:center; }
  .peer.sel { border-color:var(--accent); background:var(--sel); }
  .peer small { display:block; color:var(--accent); font-size:12px; }
  .hint { color:var(--muted); font-size:13px; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:22px 12px; text-align:center; color:var(--muted); }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #drop .row { justify-content:center; }
  .tcard { border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:10px; }
  .tcard:first-child { margin-top:0; }
  .ttl { font-weight:600; }
  .sub { color:var(--muted); font-size:13px; word-break:break-all; }
  .stat { margin:6px 0; }
  .pinbox { background:var(--sel); border-radius:6px; padding:8px 10px; margin:8px 0; }
  .pinbox b { font-size:24px; letter-spacing:6px; margin-left:6px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:6px 0 4px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  .list:empty::before { content:attr(data-empty); color:var(--muted); font-size:13px; }
  #ov { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #ov .box { background:var(--card); border-radius:12px; padding:20px; width:100%; max-width:380px; }
  #ov input { width:100%; font-size:28px; text-align:center; letter-spacing:10px; padding:8px; border:2px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); margin:10px 0 4px; }
  #pinErr { color:var(--danger); font-size:13px; min-height:18px; }
  .opt { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 14px; border-radius:8px; z-index:20; }
</style>
</head>
<body>
<main>
  <header>
    <h1>HopDrop</h1>
    <div class="me"><span class="dot" id="dot"></span><span id="meName"></span><button class="ghost" id="rename">Rename</button></div>
  </header>

  <div class="tabs">
    <button id="tabSend" class="act">Send</button>
    <button id="tabRecv">Receive<span class="badge" id="badge" hidden></span></button>
  </div>

  <section id="paneSend">
    <div class="card">
      <h2>1. Choose a device</h2>
      <div class="peers" id="peers"></div>
      <div class="hint" id="noPeers" hidden>Nobody else is online. On the other laptop open <b id="url"></b></div>
    </div>
    <div class="card">
      <h2>2. Choose what to send</h2>
      <div id="drop">
        Drop files or folders here
        <div class="row">
          <button id="pickFiles">Choose files</button>
          <button id="pickFolder">Choose folder</button>
        </div>
      </div>
      <input type="file" id="fileInput" multiple hidden>
      <input type="file" id="folderInput" webkitdirectory hidden>
      <div class="hint" id="selInfo" style="margin-top:10px"></div>
      <div class="row">
        <button id="sendBtn" disabled>Send</button>
        <button class="ghost" id="clearBtn" hidden>Clear</button>
      </div>
    </div>
    <div class="card">
      <h2>Outgoing</h2>
      <div class="list" id="outList" data-empty="Nothing sent yet."></div>
    </div>
  </section>

  <section id="paneRecv" hidden>
    <div class="card">
      <h2>Ready to receive</h2>
      <div>You are visible as <b id="meName2"></b>. Keep this page open; incoming files will ask for your approval and a PIN.</div>
      <label class="opt"><input type="checkbox" id="directChk"> Connect straight to the sender when the host laptop is a third machine (faster on Wi-Fi; turn off if the host is on Ethernet)</label>
    </div>
    <div class="card">
      <h2>Incoming</h2>
      <div class="list" id="inList" data-empty="Nothing received yet."></div>
    </div>
  </section>
</main>

<div id="ov" hidden></div>
<div id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id), enc = encodeURIComponent;
const ACTIVE = ["offered","accepted","ready","downloading"];
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
}
function fmtSize(n) {
  if (n < 1024) return Math.round(n) + " B";
  const u = ["KB","MB","GB","TB"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < 3);
  return n.toFixed(n >= 100 ? 0 : 1) + " " + u[i];
}
function fmtTime(s) {
  s = Math.round(s);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.floor(s % 3600 / 60) + "m";
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500);
}

// ---------- identity ----------
let myId = null;
try { myId = sessionStorage.getItem("id"); } catch (e) {}
if (!myId) {
  myId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
  try { sessionStorage.setItem("id", myId); } catch (e) {}
}
let myName = null;
try { myName = localStorage.getItem("name"); } catch (e) {}
if (!myName) myName = "Device-" + Math.floor(1000 + Math.random() * 9000);
const me = { id: myId, name: myName };

// ---------- state ----------
let ws = null, peers = [], target = null, sel = [];
const tr = {}, outbox = {}, upctl = {}, dlNext = {}, cards = {};

function wsend(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }

function connect() {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + location.host + "/ws?id=" + enc(me.id) + "&name=" + enc(me.name));
  ws.onopen = () => $("dot").classList.add("on");
  ws.onclose = () => { $("dot").classList.remove("on"); setTimeout(connect, 1500); };
  ws.onmessage = e => onMsg(JSON.parse(e.data));
}

function onMsg(d) {
  if (d.type === "peers") {
    me.name = d.me_name; peers = d.peers;
    if (target && !peers.some(p => p.id === target)) target = null;
    renderMe(); renderPeers(); renderSend();
  } else if (d.type === "transfer") {
    tr[d.t.id] = d.t; onTransfer(d.t); renderTransfers();
  } else if (d.type === "pin_bad") {
    const el = $("pinErr");
    if (el) { el.textContent = "Wrong PIN. " + d.left + " tries left."; $("pinIn").value = ""; $("pinIn").focus(); }
  } else if (d.type === "signal") {
    onSignal(d.tid, d.data);
  } else if (d.type === "error") {
    toast(d.msg);
  }
}

function onTransfer(t) {
  const live = ACTIVE.includes(t.state), s = rtc[t.id];
  if (s && !s.closed && (!live || t.relay)) closeDirect(t.id);   // finished, or fell back to the relay
  if (t.frm === me.id) {
    if (!live) { if (upctl[t.id]) upctl[t.id].abort(); delete outbox[t.ref]; return; }
    const need = t.relay ? ["ready", "downloading"].includes(t.state) && !upctl[t.id] : !s;
    if (need && !outbox[t.ref]) wsend({ type: "cancel", tid: t.id, reason: "sender page reloaded" });
    else if (need) t.relay ? startUpload(t) : startDirect(t);
  }
  if (t.to === me.id && live) {
    // Relay: download each file in turn. t.done is how many have arrived; fetch that one next.
    if (t.relay && ["ready", "downloading"].includes(t.state) && t.done < t.count) {
      if (dlNext[t.id] !== t.done) { dlNext[t.id] = t.done; saveT(t.id, t.done); }
    }
    if (!t.relay && t.state === "downloading" && !s) wsend({ type: "cancel", tid: t.id, reason: "receiver page reloaded" });
  }
}

// ---------- sending ----------
async function startUpload(t) {
  const items = outbox[t.ref], ctl = new AbortController();
  upctl[t.id] = ctl;
  // Sequential, in index order: a folder is zipped on the fly server-side and entries must arrive in order.
  for (let i = 0; i < items.length; i++) {
    try {
      const r = await fetch("/api/up/" + t.id + "/" + i + "?key=" + enc(t.key),
        { method: "POST", body: items[i].file, signal: ctl.signal });
      if (!r.ok) throw new Error(r.status);
    } catch (e) {
      if (!ctl.signal.aborted) wsend({ type: "cancel", tid: t.id, reason: "upload failed" });
      return;
    }
  }
}

function doSend() {
  if (!target || !sel.length) return;
  const ref = Math.random().toString(36).slice(2);
  outbox[ref] = sel;
  wsend({ type: "offer", to: target, ref, files: sel.map(s => ({ name: s.rel, size: s.file.size })) });
  sel = []; renderSend();
}

function addItems(list) {
  const have = new Set(sel.map(s => s.rel));
  for (const it of list) if (!have.has(it.rel)) { sel.push(it); have.add(it.rel); }
  renderSend();
}

async function walk(entry, prefix, out) {
  if (entry.isFile) {
    const f = await new Promise((res, rej) => entry.file(res, rej));
    out.push({ file: f, rel: prefix + entry.name });
  } else if (entry.isDirectory) {
    const r = entry.createReader(); let batch;
    do {
      batch = await new Promise((res, rej) => r.readEntries(res, rej));
      for (const e of batch) await walk(e, prefix + entry.name + "/", out);
    } while (batch.length);
  }
}

// ---------- direct (WebRTC) ----------
// Browser to browser over the LAN; the server only passes the handshake along. Streaming straight to
// disk needs HTTPS, so the receiver collects the data in Blobs (Chromium pages big ones to disk) and
// saves at the end. Bigger transfers, and connections that can't be made, go through the relay.
const MB = 1 << 20, GB = 1 << 30;
const DIRECT_MAX = /Chrome\//.test(navigator.userAgent) ? 8 * GB : 1 * GB;   // Chrome, Edge, Opera
const MSG = 64 * 1024, READ = 4 * MB, HIGH = 8 * MB, LOW = 2 * MB, FLUSH = 16 * MB, CONNECT_MS = 10000;
const rtc = {};   // tid -> session; closed sessions stay so they are not restarted

function directOn() { try { return localStorage.getItem("direct") !== "0"; } catch (e) { return true; } }
function canDirect(t) { return directOn() && !!window.RTCPeerConnection && t.total <= DIRECT_MAX; }

function newPeer(tid) {
  const s = { pc: new RTCPeerConnection({ iceServers: [] }), cands: [], closed: false, moved: false, fin: false };
  s.pc.onicecandidate = e => { if (e.candidate) wsend({ type: "signal", tid, data: { cand: e.candidate.toJSON() } }); };
  s.pc.onconnectionstatechange = () => { if (s.pc.connectionState === "failed") directLost(tid); };
  return rtc[tid] = s;
}

function closeDirect(tid) {
  const s = rtc[tid]; if (!s || s.closed) return;
  s.closed = true; clearTimeout(s.timer); clearInterval(s.rep);
  s.pend = s.parts = s.zip = null;
  try { s.pc.close(); } catch (e) {}
}

// Before any data has moved the relay can take over; after that a broken link ends the transfer.
function directLost(tid) {
  const s = rtc[tid], t = tr[tid];
  if (!s || s.closed || s.fin) return;
  closeDirect(tid);
  if (!t || !ACTIVE.includes(t.state)) return;
  if (t.state === "accepted" && !s.moved) wsend({ type: "fallback", tid });
  else wsend({ type: "cancel", tid, reason: "direct connection lost" });
}

async function onSignal(tid, data) {
  const t = tr[tid];
  if (!t || t.relay || !ACTIVE.includes(t.state) || !data) return;
  let s = rtc[tid];
  try {
    if (data.sdp) {
      if (!s && t.to === me.id) { s = newPeer(tid); s.pc.ondatachannel = e => recvChannel(tid, s, e.channel); }
      if (!s || s.closed) return;
      await s.pc.setRemoteDescription(data.sdp);
      for (const c of s.cands.splice(0)) await s.pc.addIceCandidate(c);
      if (data.sdp.type === "offer") {
        await s.pc.setLocalDescription(await s.pc.createAnswer());
        wsend({ type: "signal", tid, data: { sdp: s.pc.localDescription } });
      }
    } else if (data.cand && s && !s.closed) {
      if (s.pc.remoteDescription) await s.pc.addIceCandidate(data.cand); else s.cands.push(data.cand);
    }
  } catch (e) { directLost(tid); }
}

async function startDirect(t) {
  const s = newPeer(t.id), items = outbox[t.ref], dc = s.pc.createDataChannel("hopdrop");
  dc.binaryType = "arraybuffer";
  s.timer = setTimeout(() => { if (dc.readyState !== "open") directLost(t.id); }, CONNECT_MS);
  dc.onopen = () => { clearTimeout(s.timer); pump(t.id, s, dc, items); };
  dc.onclose = () => directLost(t.id);
  try {
    await s.pc.setLocalDescription(await s.pc.createOffer());
    wsend({ type: "signal", tid: t.id, data: { sdp: s.pc.localDescription } });
  } catch (e) { directLost(t.id); }
}

// Sender: a JSON manifest, then every file's bytes back to back; sizes mark where each file ends.
async function pump(tid, s, dc, items) {
  let sent = 0, last = 0;
  dc.bufferedAmountLowThreshold = LOW;
  try {
    dc.send(JSON.stringify({ files: items.map(it => ({ name: it.rel, size: it.file.size })) }));
    for (const it of items) {
      for (let off = 0; off < it.file.size; off += READ) {
        const buf = await it.file.slice(off, off + READ).arrayBuffer();
        for (let p = 0; p < buf.byteLength; p += MSG) {
          if (dc.bufferedAmount > HIGH) await new Promise(r => dc.addEventListener("bufferedamountlow", r, { once: true }));
          if (s.closed) return;
          const n = Math.min(MSG, buf.byteLength - p);
          dc.send(new Uint8Array(buf, p, n));
          sent += n; s.moved = true;
          if (performance.now() - last > 300) {
            last = performance.now();
            wsend({ type: "progress", tid, up: Math.max(0, sent - dc.bufferedAmount) });
          }
        }
      }
    }
    s.fin = true;   // the receiver reports completion; its side notices a broken link from here on
  } catch (e) { directLost(tid); }
}

function recvChannel(tid, s, dc) {
  dc.binaryType = "arraybuffer";
  dc.onclose = () => directLost(tid);
  dc.onmessage = e => {
    try { onChunk(tid, s, e.data); }
    catch (err) { closeDirect(tid); wsend({ type: "cancel", tid, reason: "bad data from sender" }); }
  };
}

function onChunk(tid, s, d) {
  const t = tr[tid];
  if (s.closed || !t) return;
  if (typeof d === "string") {
    const files = JSON.parse(d).files;
    if (s.files || !Array.isArray(files) || files.length !== t.count ||
        files.some(f => !(Number.isSafeInteger(f.size) && f.size >= 0)) ||
        files.reduce((a, f) => a + f.size, 0) !== t.total) throw new Error("manifest");
    s.files = files.map(f => ({ name: cleanRel(f.name) || "file", size: f.size }));
    Object.assign(s, { cur: 0, got: 0, down: 0, done: 0, crc: 0, pend: [], pendN: 0, parts: [], zip: t.zip ? zipper() : null });
    s.rep = setInterval(() => wsend({ type: "progress", tid, down: s.down, done: s.done }), 300);
    nextFile(tid, s);
    return;
  }
  if (!s.files || s.cur >= s.files.length) throw new Error("unexpected data");
  const u8 = new Uint8Array(d);
  s.got += u8.length; s.down += u8.length; s.moved = true;
  if (s.got > s.files[s.cur].size) throw new Error("file too long");
  if (s.zip) s.crc = crc32(s.crc, u8);
  s.pend.push(d); s.pendN += u8.length;
  if (s.pendN >= FLUSH) flushPend(s);   // small Blobs merged into big ones let the browser page them to disk
  if (s.got === s.files[s.cur].size) { fileDone(s); nextFile(tid, s); }
}

function flushPend(s) { if (s.pendN) { s.parts.push(new Blob(s.pend)); s.pend = []; s.pendN = 0; } }

function fileDone(s) {
  flushPend(s);
  const f = s.files[s.cur];
  if (s.zip) s.zip.add(f.name, s.crc, f.size, s.parts);
  else saveBlob(new Blob(s.parts), f.name.split("/").pop());
  s.parts = []; s.crc = 0; s.got = 0; s.cur++; s.done++;
}

function nextFile(tid, s) {
  while (s.cur < s.files.length && s.files[s.cur].size === 0) fileDone(s);
  if (s.cur < s.files.length) return;
  if (s.zip) saveBlob(s.zip.finish(), tr[tid].out_name || "files.zip");
  s.fin = true; clearInterval(s.rep);
  wsend({ type: "complete", tid });   // the connection closes when the server confirms
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = h("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5 * 60000);
}

function cleanRel(name) {
  return String(name).split(/[\\/]+/).filter(p => p && p !== "." && p !== "..")
    .map(p => p.replace(/[<>:"|?*\x00-\x1f]/g, "_").slice(0, 200)).join("/");
}

const CRC = new Int32Array(256).map((_, n) => {
  let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
  return c;
});
function crc32(crc, u8) {
  crc = ~crc;
  for (let i = 0; i < u8.length; i++) crc = CRC[(crc ^ u8[i]) & 255] ^ (crc >>> 8);
  return ~crc;
}

// Uncompressed zip, same as the relay's. Each entry is added once its CRC is known, so headers carry
// real values (no data descriptors); ZIP64 fields appear only where a size or offset needs them.
function zipper() {
  const parts = [], cd = [], te = new TextEncoder(), M32 = 0xFFFFFFFF, d = new Date();
  const time = d.getHours() << 11 | d.getMinutes() << 5 | d.getSeconds() >> 1;
  const date = (d.getFullYear() - 1980) << 9 | (d.getMonth() + 1) << 5 | d.getDate();
  const rec = n => { const b = new Uint8Array(n); return [b, new DataView(b.buffer)]; };
  const u64 = (v, o, x) => { v.setUint32(o, x % 2 ** 32, true); v.setUint32(o + 4, Math.floor(x / 2 ** 32), true); };
  let off = 0;
  return {
    add(name, crc, size, data) {
      const nb = te.encode(name), big = size >= M32, [b, v] = rec(30 + nb.length + (big ? 20 : 0));
      v.setUint32(0, 0x04034b50, true); v.setUint16(4, big ? 45 : 20, true); v.setUint16(6, 0x800, true);
      v.setUint16(10, time, true); v.setUint16(12, date, true); v.setUint32(14, crc >>> 0, true);
      v.setUint32(18, big ? M32 : size, true); v.setUint32(22, big ? M32 : size, true);
      v.setUint16(26, nb.length, true); v.setUint16(28, big ? 20 : 0, true); b.set(nb, 30);
      if (big) { const o = 30 + nb.length; v.setUint16(o, 1, true); v.setUint16(o + 2, 16, true); u64(v, o + 4, size); u64(v, o + 12, size); }
      parts.push(b, ...data);
      cd.push({ nb, crc, size, off });
      off += b.length + size;
    },
    finish() {
      const start = off, tail = [];
      for (const e of cd) {
        const x = [];
        if (e.size >= M32) x.push(e.size, e.size);
        if (e.off >= M32) x.push(e.off);
        const xl = x.length ? 4 + 8 * x.length : 0, [b, v] = rec(46 + e.nb.length + xl);
        v.setUint32(0, 0x02014b50, true); v.setUint16(4, 45, true); v.setUint16(6, xl ? 45 : 20, true);
        v.setUint16(8, 0x800, true); v.setUint16(12, time, true); v.setUint16(14, date, true);
        v.setUint32(16, e.crc >>> 0, true); v.setUint32(20, Math.min(e.size, M32), true); v.setUint32(24, Math.min(e.size, M32), true);
        v.setUint16(28, e.nb.length, true); v.setUint16(30, xl, true); v.setUint32(42, Math.min(e.off, M32), true);
        b.set(e.nb, 46);
        if (xl) {
          const o = 46 + e.nb.length; v.setUint16(o, 1, true); v.setUint16(o + 2, 8 * x.length, true);
          x.forEach((n, k) => u64(v, o + 4 + 8 * k, n));
        }
        tail.push(b); off += b.length;
      }
      const size = off - start, n = cd.length;
      if (n >= 0xFFFF || start >= M32 || size >= M32) {
        const [b, v] = rec(76);   // ZIP64 end record + locator
        v.setUint32(0, 0x06064b50, true); u64(v, 4, 44); v.setUint16(12, 45, true); v.setUint16(14, 45, true);
        u64(v, 24, n); u64(v, 32, n); u64(v, 40, size); u64(v, 48, start);
        v.setUint32(56, 0x07064b50, true); u64(v, 64, off); v.setUint32(72, 1, true);
        tail.push(b);
      }
      const [b, v] = rec(22);
      v.setUint32(0, 0x06054b50, true); v.setUint16(8, Math.min(n, 0xFFFF), true); v.setUint16(10, Math.min(n, 0xFFFF), true);
      v.setUint32(12, Math.min(size, M32), true); v.setUint32(16, Math.min(start, M32), true);
      tail.push(b);
      return new Blob(parts.concat(tail), { type: "application/zip" });
    },
  };
}

// ---------- receiving ----------
function saveT(tid, i) {
  const t = tr[tid]; if (!t) return;
  const a = h("a", { href: "/api/down/" + t.id + "/" + (i || 0) + "?key=" + enc(t.key), download: "" });
  document.body.append(a); a.click(); a.remove();
}
function cancelT(tid) {
  const t = tr[tid];
  wsend({ type: t.state === "offered" && t.to === me.id ? "decline" : "cancel", tid });
}
function dismiss(tid) {
  if (cards[tid]) cards[tid].el.remove();
  delete cards[tid]; delete tr[tid];
}

// ---------- rendering ----------
function renderMe() { $("meName").textContent = me.name; $("meName2").textContent = me.name; }

function renderPeers() {
  const box = $("peers");
  box.replaceChildren(...peers.map(p =>
    h("button", { class: "peer" + (p.id === target ? " sel" : ""), onclick: () => { target = p.id; renderPeers(); renderSend(); } },
      p.name, h("small", {}, "online"))));
  $("noPeers").hidden = peers.length > 0;
}

function renderSend() {
  const n = sel.length, size = sel.reduce((a, s) => a + s.file.size, 0);
  $("selInfo").textContent = n ? n + " file" + (n > 1 ? "s" : "") + " selected · " + fmtSize(size) : "Nothing selected.";
  $("clearBtn").hidden = !n;
  $("sendBtn").disabled = !(n && target);
  const t = peers.find(p => p.id === target);
  $("sendBtn").textContent = t ? "Send to " + t.name : "Send";
}

function statusOf(t) {
  const out = t.frm === me.id, n = out ? t.to_name : t.frm_name;
  const of = (!t.zip && t.count > 1) ? " (file " + Math.min(t.done + 1, t.count) + " of " + t.count + ")" : "";
  switch (t.state) {
    case "offered": return out ? "Waiting for " + n + " to accept…" : "Waiting for your approval";
    case "accepted": return "Connecting directly to " + n + "…";
    case "ready": return out ? "Waiting for " + n + " to start the download…" : "Ready. Starting download…";
    case "downloading": return (out ? n + " is receiving" : "Receiving") + of + (t.zip ? " (as a .zip)" : "") + "…";
    case "done":
      if (out) return "Delivered to " + n;
      return t.zip ? "Received as " + t.out_name + ". Check your Downloads folder."
        : (t.count > 1 ? "Received " + t.count + " files. Check your Downloads folder." : "Received. Check your Downloads folder.");
    default: return t.note || (t.state === "declined" ? "Declined" : "Cancelled");
  }
}

function updateCard(t) {
  const out = t.frm === me.id, c = cards[t.id] || makeCard(t), live = ACTIVE.includes(t.state);
  c.title.textContent = (out ? "↑ To " + t.to_name : "↓ From " + t.frm_name);
  c.sub.textContent = t.count + " file" + (t.count > 1 ? "s" : "") + " · " + fmtSize(t.total) + " — " + t.names.join(", ") + (t.count > t.names.length ? "…" : "");
  c.pin.hidden = !(out && t.state === "offered");
  c.pinNum.textContent = t.pin || "";
  c.pinWho.textContent = "Tell " + t.to_name + " this PIN to accept:";
  c.stat.textContent = statusOf(t);
  // Progress tracks bytes delivered end-to-end (t.down); the sender's own feed is t.up.
  const done = out ? t.up : t.down, total = t.total;
  const showBar = ["ready", "downloading"].includes(t.state);
  c.bar.hidden = c.info.hidden = !showBar;
  const pct = total ? Math.min(100, done / total * 100) : 0;
  c.fill.style.width = pct.toFixed(1) + "%";
  const sp = out ? t.sp_up : t.sp_down;
  let info = fmtSize(done) + " / " + fmtSize(total) + " · " + pct.toFixed(0) + "%";
  if (sp > 0) info += " · " + (out ? "↑ " : "↓ ") + fmtSize(sp) + "/s · " + fmtTime((total - done) / sp) + " left";
  c.info.textContent = info + (t.relay ? " · via host" : " · direct");
  c.btnCancel.hidden = !live;
  c.btnCancel.textContent = t.state === "offered" && !out ? "Decline" : "Cancel";
  // Only before the server sees the download: if the browser blocked it, this retries it.
  c.btnSave.hidden = !(!out && t.relay && t.state === "ready");
  c.btnX.hidden = live;
  const cont = out ? $("outList") : $("inList");
  if (!c.el.parentNode) cont.prepend(c.el);
}

function makeCard(t) {
  const c = {};
  c.title = h("div", { class: "ttl" }); c.sub = h("div", { class: "sub" });
  c.pinWho = h("span"); c.pinNum = h("b");
  c.pin = h("div", { class: "pinbox" }, c.pinWho, c.pinNum);
  c.stat = h("div", { class: "stat" });
  c.fill = h("i"); c.bar = h("div", { class: "bar" }, c.fill); c.info = h("div", { class: "sub" });
  c.btnSave = h("button", { onclick: () => saveT(t.id, (tr[t.id] || {}).done || 0) }, "Save");
  c.btnCancel = h("button", { class: "danger", onclick: () => cancelT(t.id) }, "Cancel");
  c.btnX = h("button", { class: "ghost", onclick: () => dismiss(t.id) }, "Dismiss");
  c.el = h("div", { class: "tcard" }, c.title, c.sub, c.pin, c.stat, c.bar, c.info, h("div", { class: "row" }, c.btnSave, c.btnCancel, c.btnX));
  return cards[t.id] = c;
}

let ovTid = null;
function renderOverlay() {
  const t = Object.values(tr).find(x => x.to === me.id && x.state === "offered");
  const ov = $("ov");
  if (!t) { ov.hidden = true; ovTid = null; return; }
  ov.hidden = false;
  if (ovTid === t.id) return;
  ovTid = t.id;
  const inp = h("input", { id: "pinIn", maxlength: "4", inputmode: "numeric", autocomplete: "off", placeholder: "····" });
  const accept = () => {
    if (inp.value.trim().length !== 4) { $("pinErr").textContent = "Enter the 4-digit PIN shown on the sender's screen."; return; }
    wsend({ type: "accept", tid: t.id, pin: inp.value.trim(), direct: canDirect(t) });
  };
  inp.onkeydown = e => { if (e.key === "Enter") accept(); };
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, ""); };
  ov.replaceChildren(h("div", { class: "box" },
    h("h2", {}, "Incoming transfer"),
    h("div", {}, h("b", {}, t.frm_name), " wants to send you ", h("b", {}, t.count + " file" + (t.count > 1 ? "s" : "") + " (" + fmtSize(t.total) + ")")),
    h("div", { class: "sub", style: "margin-top:6px" }, t.names.join(", ") + (t.count > t.names.length ? "…" : "")),
    h("div", { class: "hint", style: "margin-top:12px" }, "Enter the PIN shown on " + t.frm_name + "'s screen to accept:"),
    inp, h("div", { id: "pinErr" }),
    h("div", { class: "row" }, h("button", { onclick: accept }, "Accept"), h("button", { class: "ghost", onclick: () => cancelT(t.id) }, "Decline"))));
  inp.focus();
}

function renderTransfers() {
  Object.values(tr).forEach(updateCard);
  renderOverlay();
  const pending = Object.values(tr).filter(t => t.to === me.id && ACTIVE.includes(t.state)).length;
  $("badge").hidden = !pending; $("badge").textContent = pending;
  document.title = (Object.values(tr).some(t => t.to === me.id && t.state === "offered") ? "● Incoming — " : "") + "HopDrop";
}

// ---------- wiring ----------
function tab(send) {
  $("paneSend").hidden = !send; $("paneRecv").hidden = send;
  $("tabSend").classList.toggle("act", send); $("tabRecv").classList.toggle("act", !send);
}
$("tabSend").onclick = () => tab(true);
$("tabRecv").onclick = () => tab(false);
$("rename").onclick = () => {
  const n = prompt("Device name", me.name);
  if (n && n.trim()) { try { localStorage.setItem("name", n.trim()); } catch (e) {} wsend({ type: "rename", name: n.trim() }); }
};
$("pickFiles").onclick = () => $("fileInput").click();
$("pickFolder").onclick = () => $("folderInput").click();
$("fileInput").onchange = e => { addItems([...e.target.files].map(f => ({ file: f, rel: f.name }))); e.target.value = ""; };
$("folderInput").onchange = e => { addItems([...e.target.files].map(f => ({ file: f, rel: f.webkitRelativePath || f.name }))); e.target.value = ""; };
$("directChk").checked = directOn();
$("directChk").onchange = e => { try { localStorage.setItem("direct", e.target.checked ? "1" : "0"); } catch (err) {} };
$("sendBtn").onclick = doSend;
$("clearBtn").onclick = () => { sel = []; renderSend(); };
const drop = $("drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", async e => {
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const out = [];
  if (entries.length) for (const en of entries) await walk(en, "", out);
  else for (const f of e.dataTransfer.files) out.push({ file: f, rel: f.name });
  addItems(out);
});
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

fetch("/api/info").then(r => r.json()).then(d => $("url").textContent = d.url).catch(() => {});
renderMe(); renderPeers(); renderSend(); connect();
</script>
</body>
</html>
